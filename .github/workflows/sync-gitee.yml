name: Sync to Gitee Mirror

on:
  push:
    branches:
      - main
  schedule:
    # 每天凌晨 2 点自动同步
    - cron: '0 18 * * *'  # UTC 18:00 = Beijing 02:00

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ secrets.GITEE_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 添加 Gitee 远程仓库
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/zero-william163/Pro.git || true

          # 推送所有分支
          git push gitee main --force

          # 推送所有标签
          git push gitee --tags --force

          echo "===== Gitee 同步完成 ====="
          echo "仓库地址: https://gitee.com/zero-william163/Pro"
          echo "version.json: https://gitee.com/zero-william163/Pro/raw/main/version.json"

      - name: Sync Gitee Releases
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 获取 GitHub 最新 Release 信息
          GH_RELEASE=$(curl -s "https://api.github.com/repos/Zero-william163/Pro/releases/latest")
          TAG_NAME=$(echo "$GH_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")

          if [ -z "$TAG_NAME" ]; then
            echo "No GitHub release found"
            exit 0
          fi

          echo "Latest GitHub release: $TAG_NAME"

          # 检查 Gitee 是否已有此 Release
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/zero-william163/Pro/releases/tags/${TAG_NAME}" \
            -d "access_token=${GITEE_TOKEN}")

          EXISTING_ID=$(echo "$EXISTING" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "" ]; then
            echo "Gitee already has release for $TAG_NAME, skipping"
            exit 0
          fi

          # 创建 Gitee Release
          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/zero-william163/Pro/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"${TAG_NAME}\",
              \"body\": \"Release ${TAG_NAME}\",
              \"target_commitish\": \"main\"
            }")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ -n "$RELEASE_ID" ]; then
            echo "Created Gitee release with ID: $RELEASE_ID"

            # 获取 GitHub Release 中的 APK 下载地址
            APK_URL=$(echo "$GH_RELEASE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for asset in data.get('assets', []):
              if asset['name'].endswith('.apk'):
                  print(asset['browser_download_url'])
                  break
          " 2>/dev/null || echo "")

            if [ -n "$APK_URL" ]; then
              echo "Downloading APK from: $APK_URL"
              curl -L -o /tmp/countdown.apk "$APK_URL"

              # 上传到 Gitee Release
              curl -s -X POST "https://gitee.com/api/v5/repos/zero-william163/Pro/releases/${RELEASE_ID}/attach_files" \
                -H "Content-Type: multipart/form-data" \
                -F "file=@/tmp/countdown.apk" \
                -F "access_token=${GITEE_TOKEN}"

              echo "Uploaded APK to Gitee Release"
            fi
          else
            echo "Failed to create Gitee release: $RESPONSE"
          fi
