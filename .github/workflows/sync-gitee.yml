name: Sync to Gitee Mirror

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not configured, skipping sync"
            exit 0
          fi

          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/zero-william163/Pro.git || true
          git push gitee main --force
          git push gitee --tags --force
          echo "===== Gitee 仓库同步完成 ====="

      - name: Sync Gitee Releases
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            exit 0
          fi

          GH_RELEASE=$(curl -s "https://api.github.com/repos/Zero-william163/Pro/releases/latest")
          TAG_NAME=$(echo "$GH_RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name',''))" 2>/dev/null || echo "")

          if [ -z "$TAG_NAME" ]; then
            echo "No GitHub release found"
            exit 0
          fi

          echo "Latest GitHub release: $TAG_NAME"

          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/zero-william163/Pro/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}")
          EXISTING_ID=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','') if isinstance(d, dict) else '')" 2>/dev/null || echo "")

          if [ -n "$EXISTING_ID" ]; then
            echo "Gitee already has release for $TAG_NAME, skipping"
            exit 0
          fi

          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/zero-william163/Pro/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\",\"body\":\"Release ${TAG_NAME}\",\"target_commitish\":\"main\"}")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','') if isinstance(d, dict) else '')" 2>/dev/null || echo "")

          if [ -n "$RELEASE_ID" ]; then
            echo "Created Gitee release with ID: $RELEASE_ID"
            APK_URL=$(echo "$GH_RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(a['browser_download_url']) for a in d.get('assets',[]) if a['name'].endswith('.apk')] or print('')" 2>/dev/null || echo "")

            if [ -n "$APK_URL" ]; then
              echo "Downloading APK from: $APK_URL"
              curl -L -o /tmp/countdown.apk "$APK_URL"
              curl -s -X POST "https://gitee.com/api/v5/repos/zero-william163/Pro/releases/${RELEASE_ID}/attach_files" \
                -F "file=@/tmp/countdown.apk" \
                -F "access_token=${GITEE_TOKEN}"
              echo "Uploaded APK to Gitee Release"
            fi
          else
            echo "Failed to create Gitee release: $RESPONSE"
          fi
